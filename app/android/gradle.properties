org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Flutter 3.47 still accesses AGP's legacy AbstractAppExtension. Remove this
# compatibility flag once Flutter supports AGP 9's new DSL.
android.newDsl=false
# Use AGP 9's built-in Kotlin. With it on, plugins such as workmanager_android
# skip applying the Kotlin Gradle Plugin (KGP) themselves.
android.builtInKotlin=true
# Build speed: reuse task outputs across builds/clean, run independent modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# Plugin sources live in the pub cache, outside this project. Kotlin's
# incremental compiler cannot reliably track files outside the project root
# (cross-drive paths, stale daemon caches), and plugin code never changes, so
# compile Kotlin non-incrementally. The Gradle build cache still skips
# unchanged modules.
kotlin.incremental=false
