group = 'com.aash591.drive_authorization'
version = '1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
}
apply plugin: 'com.android.library'
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 && project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) { apply plugin: 'kotlin-android' }
android {
    namespace = 'com.aash591.drive_authorization'
    compileSdk = 36
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    if (!builtInKotlin) { kotlinOptions { jvmTarget = '17' } }
}
repositories { google(); mavenCentral() }
dependencies { implementation 'com.google.android.gms:play-services-auth:21.6.0' }
